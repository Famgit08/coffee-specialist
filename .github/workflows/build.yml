name: Build Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: docker build -t coffee-specialist-backend ./backend

      - name: Build Frontend Docker image
        run: docker build -t coffee-specialist-frontend ./frontend
