<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Coffee Specialist</title>
    <meta name="description" content="Настройте свой вкусовой профиль в Coffee Specialist, чтобы получать идеальный кофе.">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-orange-50 min-h-screen pb-20">

    <header class="bg-coffee text-white px-5 py-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="text-xl font-bold flex items-center gap-2">
            <img src="images/coffee.png" alt="Coffee Specialist" class="h-6 w-6 filter brightness-0 invert">
            Coffee Specialist
        </div>
        <a href="auth.html" class="hover:opacity-80 transition">
            <img src="images/user.png" alt="Профиль" class="h-6 w-6 filter brightness-0 invert">
        </a>
    </header>

    <main class="max-w-2xl mx-auto p-4 mt-4">
        <h1 class="text-2xl font-bold text-stone-800 mb-4">Вкусовой профиль</h1>
        <div class="bg-white rounded-xl p-6 shadow-lg max-w-md mx-auto">
            <div class="mb-6">
                <label class="block text-sm font-semibold text-stone-800 mb-3">Крепость</label>
                <input type="range" min="1" max="10" value="5" id="strength" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-stone-800">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-stone-800 mb-3">Кислотность</label>
                <input type="range" min="1" max="10" value="5" id="acidity" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-stone-800">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-stone-800 mb-3">Сладость</label>
                <input type="range" min="1" max="10" value="5" id="sweetness" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-stone-800">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-stone-800 mb-2">Любимый сорт</label>
                <select id="favorite-sort" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-800 transition bg-white">
                    <option value="Арабика">Арабика</option>
                    <option value="Робуста">Робуста</option>
                    <option value="Бленд">Бленд</option>
                </select>
            </div>
            <button onclick="saveProfile()" class="w-full bg-coffee text-white font-bold py-3 rounded-lg hover:opacity-90 transition shadow-md">Сохранить</button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-coffee flex justify-around py-3 z-50 shadow-lg">
        <a href="index.html" class="opacity-60 hover:opacity-100 transition"><img src="images/home.png" class="h-6 w-6 filter brightness-0 invert"></a>
        <a href="menu.html" class="opacity-60 hover:opacity-100 transition"><img src="images/menu.png" class="h-6 w-6 filter brightness-0 invert"></a>
        <a href="cart.html" class="opacity-60 hover:opacity-100 transition"><img src="images/cart.png" class="h-6 w-6 filter brightness-0 invert"></a>
        <a href="profile.html" class="opacity-100"><img src="images/user.png" class="h-6 w-6 filter brightness-0 invert"></a>
    </nav>

    <script>
        function saveProfile() {
            const profile = {
                strength: document.getElementById('strength').value,
                acidity: document.getElementById('acidity').value,
                sweetness: document.getElementById('sweetness').value,
                sort: document.getElementById('favorite-sort').value
            };
            localStorage.setItem('tasteProfile', JSON.stringify(profile));
            alert('Вкусовой профиль сохранен!');
        }
    </script>
</body>
</html>
