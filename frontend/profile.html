<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Coffee Specialist</title>
    <meta name="description" content="Настройте свой вкусовой профиль в Coffee Specialist, чтобы получать идеальный кофе.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/coffee.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
            Coffee Specialist</div>
        <a href="profile.html" class="profile-icon">
            <img src="images/user.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
    </header>

    <main>
        <h1>Вкусовой профиль</h1>
        <div class="form-container">
            <div class="form-group">
                <label>Крепость</label>
                <input type="range" min="1" max="10" value="5" id="strength">
            </div>
            <div class="form-group">
                <label>Кислотность</label>
                <input type="range" min="1" max="10" value="5" id="acidity">
            </div>
            <div class="form-group">
                <label>Сладость</label>
                <input type="range" min="1" max="10" value="5" id="sweetness">
            </div>
            
            <div class="form-group">
                <label>Любимый сорт</label>
                <select id="favorite-sort">
                    <option value="Арабика">Арабика</option>
                    <option value="Робуста">Робуста</option>
                    <option value="Бленд">Бленд</option>
                </select>
            </div>

            <button class="btn" style="width: 100%;" onclick="saveProfile()">Сохранить</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" id="nav-home">
            <img src="images/home.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
        <a href="menu.html" id="nav-menu">
            <img src="images/menu.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
        <a href="cart.html" id="nav-cart">
            <img src="images/cart.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
        <a href="profile.html" id="nav-profile" class="active">
            <img src="images/user.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
    </nav>

    <script>
        function saveProfile() {
            const profile = {
                strength: document.getElementById('strength').value,
                acidity: document.getElementById('acidity').value,
                sweetness: document.getElementById('sweetness').value,
                sort: document.getElementById('favorite-sort').value
            };
            localStorage.setItem('tasteProfile', JSON.stringify(profile));
            alert('Вкусовой профиль сохранен!');
        }
    </script>
</body>
</html>
