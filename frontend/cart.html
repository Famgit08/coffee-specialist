<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Coffee Specialist</title>
    <meta name="description" content="Ваша корзина заказов в Coffee Specialist. Проверьте состав заказа и оформите доставку.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/coffee.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
            Coffee Specialist</div>
        <a href="profile.html" class="profile-icon">
            <img src="images/user.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
    </header>

    <main>
        <h1>Корзина</h1>
        <div id="cart-items">
            <!-- Сюда будут загружаться товары -->
        </div>
        <div id="cart-total" class="total-box" style="display: none;"></div>
        <button id="checkout-btn" class="btn" style="width: 100%; display: none; margin-top: 15px;" onclick="checkout()">Оформить заказ</button>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" id="nav-home">
            <img src="images/home.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
        <a href="menu.html" id="nav-menu">
            <img src="images/menu.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
        <a href="cart.html" id="nav-cart" class="active">
            <img src="images/cart.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
        <a href="profile.html" id="nav-profile">
            <img src="images/user.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
        </a>
    </nav>

    <script src="cart.js"></script>
</body>
</html>
