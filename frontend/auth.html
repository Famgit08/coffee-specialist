<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Coffee Specialist</title>
    <meta name="description" content="Войдите в свой аккаунт Coffee Specialist.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/coffee.png" alt="Coffee Specialist" style="height: 24px; margin-right: 8px;">
            Coffee Specialist</div>
    </header>

    <main>
        <h1 style="text-align: center;">Авторизация</h1>
        <div class="form-container">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="Введите пароль">
            </div>
            <button class="btn" style="width: 100%;">Войти</button>
            <button class="btn btn-outline" style="width: 100%;">Регистрация</button>
        </div>
    </main>
</body>
</html>
