<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Coffee Specialist</title>
    <meta name="description" content="Войдите в свой аккаунт Coffee Specialist.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-orange-50 min-h-screen flex flex-col">

    <header class="bg-coffee text-white px-5 py-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="text-xl font-bold flex items-center gap-2">
            <img src="images/coffee.png" alt="Coffee Specialist" class="h-6 w-6 filter brightness-0 invert">
            Coffee Specialist
        </div>
        <a href="auth.html" class="hover:opacity-80 transition">
            <img src="images/user.png" alt="Профиль" class="h-6 w-6 filter brightness-0 invert">
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <h1 class="text-2xl font-bold text-stone-800 mb-6 text-center">Авторизация</h1>
        
            <div class="bg-white rounded-xl p-6 shadow-lg">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-stone-800 mb-2">Логин</label>
                    <input type="text" id="login-username" placeholder="Введите логин" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-800 transition">
                </div>
            
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-stone-800 mb-2">Пароль</label>
                    <input type="password" id="login-password" placeholder="Введите пароль" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-800 transition">
                </div>

                <button onclick="login()" class="w-full bg-coffee text-white font-bold py-3 rounded-lg hover:opacity-90 transition mb-3">
                    Войти
                </button>
                <button onclick="register()" class="w-full bg-transparent text-coffee font-bold py-3 rounded-lg border-2 border-coffee hover:bg-coffee hover:text-white transition">
                    Регистрация
                </button>
            </div>
        </div>
    </main>
</body>

<script>
    const API_URL = '';

    async function login() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            alert('Заполните все поля!');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('username', data.username);
                alert(`Добро пожаловать, ${data.username}!`);
                window.location.href = 'index.html';
            } else {
                alert(data.detail || 'Ошибка входа');
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Не удалось подключиться к серверу.');
        }
    }

    async function register() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            alert('Заполните все поля!');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Регистрация успешна! Теперь войдите.');
            } else {
                alert(data.detail || 'Ошибка регистрации');
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Не удалось подключиться к серверу.');
        }
    }
</script>

</html>
