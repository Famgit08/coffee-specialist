server {
    listen 80;
    server_name coffee.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;               # ← Вынесено отдельно, как требует новая версия
    server_name coffee.localhost;

    ssl_certificate /etc/nginx/certs/coffee.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/coffee.localhost-key.pem;

    location /api/ {
        proxy_pass http://backend:8000;  # ← Убедись, что 'backend' совпадает с services
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;   # ← Тоже проверь имя фронтенда!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}