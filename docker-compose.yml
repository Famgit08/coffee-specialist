services:
  backend:
    build: ./backend
    environment:
      - DB_SERVER=db,1433
      - DB_NAME=Coffee Specialist DB
      - DB_USER=sa
      - DB_PASSWORD=YourStrong!Passw0rd
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data: